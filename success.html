<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Success | SHOPBOX</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="icon" href="data:,">
    <style>
        .success-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
            background: radial-gradient(circle at top right, rgba(16, 185, 129, 0.1), transparent),
                radial-gradient(circle at bottom left, rgba(139, 92, 246, 0.1), transparent);
        }

        .success-card {
            max-width: 500px;
            width: 100%;
            padding: 4rem 2rem;
            animation: successIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes successIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .check-icon {
            width: 80px;
            height: 80px;
            background: var(--primary);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
            box-shadow: 0 0 40px rgba(16, 185, 129, 0.4);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4);
            }

            70% {
                box-shadow: 0 0 0 20px rgba(16, 185, 129, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
            }
        }

        .success-card h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, var(--foreground) 0%, var(--primary) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .success-card p {
            color: var(--muted-foreground);
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 3rem;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem 2.5rem;
            background: var(--foreground);
            color: var(--background);
            border-radius: 100px;
            font-weight: 700;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .back-btn:hover {
            transform: translateY(-3px);
            background: var(--primary);
            color: white;
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.2);
        }
    </style>
</head>

<body>
    <div class="success-page">
        <div class="success-card glass-morphism">
            <div class="check-icon">
                <i data-lucide="check" size="40"></i>
            </div>
            <h1>Payment Confirmed!</h1>
            <p>Your order has been placed successfully. A confirmation email with your digital receipt has been sent to
                your inbox.</p>
            <a href="index.html" class="back-btn">
                <i data-lucide="arrow-left"></i>
                Return to Shopbox
            </a>
        </div>
    </div>
    <script>lucide.createIcons();</script>
</body>

</html>
