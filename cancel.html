<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cancelled | SHOPBOX</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="icon" href="data:,">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
        }

        .error-card {
            max-width: 500px;
            width: 100%;
            padding: 4rem 2rem;
            animation: errorIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes errorIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .x-icon {
            width: 80px;
            height: 80px;
            background: var(--accent);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
            box-shadow: 0 0 40px rgba(244, 63, 94, 0.4);
        }

        .error-card h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 1rem;
        }

        .error-card p {
            color: var(--muted-foreground);
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 3rem;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem 2.5rem;
            background: var(--glass-border);
            color: var(--foreground);
            border-radius: 100px;
            font-weight: 700;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .back-btn:hover {
            transform: translateY(-3px);
            background: var(--foreground);
            color: var(--background);
        }
    </style>
</head>

<body>
    <div class="error-page">
        <div class="error-card glass-morphism">
            <div class="x-icon">
                <i data-lucide="x" size="40"></i>
            </div>
            <h1>Payment Cancelled</h1>
            <p>Your transaction has been cancelled. No charges were made. You can return to the shop to review your
                cart.</p>
            <a href="index.html" class="back-btn">
                <i data-lucide="arrow-left"></i>
                Back to Shop
            </a>
        </div>
    </div>
    <script>lucide.createIcons();</script>
</body>

</html>
